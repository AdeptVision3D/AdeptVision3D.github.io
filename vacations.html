<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
<script>try{var __t=localStorage.getItem("decardTheme")||"system";document.documentElement.setAttribute("data-theme",__t==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):__t);}catch(e){}(function(){var q=function(e){var v=e.viewTransition;if(v){["ready","finished","updateCallbackDone"].forEach(function(k){if(v[k]&&v[k].catch)v[k].catch(function(){});});}};addEventListener("pagereveal",q);addEventListener("pageswap",q);})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decard Studio — Отпуска</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F1830">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Geist:wght@500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/vacations.css?v=20261002r1">
<link rel="stylesheet" href="glass.css?v=15">
<script src="glass.js?v=6" defer></script>
<script src="glass-fx.js?v=5" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <div class="header-left">
                    <a href="index.html" class="btn btn-back">← Назад</a>
                    <span class="page-title">Отпуска</span>
                </div>
                <div class="user-box" id="userBox" style="display:flex; align-items:center; gap:10px; font-size:13px; color: var(--text-secondary);"></div>
            </div>
        </header>

        <div id="vacationsRoot"></div>
    </div>

    <!-- Форма добавления отпуска/больничного (только для админов) -->
    <div class="modal" id="leaveFormModal" style="display:none;">
        <div class="employee-modal-box" style="max-width: 440px;">
            <h3 style="font-size: 20px; font-weight: 700; margin-bottom: 20px;">Добавить отпуск / больничный</h3>
            <div class="field">
                <label class="field-label">Сотрудник</label>
                <select id="leaveFormEmployee" class="field-input"></select>
            </div>
            <div class="field">
                <label class="field-label">Тип</label>
                <div style="display:flex; gap:16px;">
                    <label style="display:flex; align-items:center; gap:7px; font-size:14px; cursor:pointer;">
                        <input type="radio" name="leaveFormType" value="vacation" checked> Отпуск
                    </label>
                    <label style="display:flex; align-items:center; gap:7px; font-size:14px; cursor:pointer;">
                        <input type="radio" name="leaveFormType" value="sick"> Больничный
                    </label>
                </div>
            </div>
            <div class="field-row">
                <div class="field-row-col">
                    <label class="field-label">С</label>
                    <input type="date" id="leaveFormStart" class="field-input">
                </div>
                <div class="field-row-col">
                    <label class="field-label">По</label>
                    <input type="date" id="leaveFormEnd" class="field-input">
                </div>
            </div>
            <div class="field field-lg">
                <label class="field-label">Заметка (необязательно)</label>
                <textarea id="leaveFormNote" rows="2" placeholder="Например: причина, договорённости по замене" class="field-input field-textarea"></textarea>
            </div>
            <div class="field-actions">
                <button class="btn btn-secondary" onclick="closeLeaveFormModal()">Отмена</button>
                <button class="btn btn-primary" onclick="submitLeaveForm()">Добавить</button>
            </div>
        </div>
    </div>

    <!-- Праздники (нерабочие дни) — видно всем в гриде, редактируют арт-директор/директор/админ -->
    <div class="modal" id="holidaysModal" style="display:none;">
        <div class="employee-modal-box" style="max-width: 460px;">
            <h3 style="font-size: 20px; font-weight: 700; margin-bottom: 16px;">Праздники (нерабочие дни)</h3>
            <div id="holidaysList" style="max-height: 320px; overflow-y:auto; margin-bottom:16px;"></div>
            <div class="field-row">
                <div class="field-row-col">
                    <label class="field-label">Дата</label>
                    <input type="date" id="holidayNewDate" class="field-input">
                </div>
                <div class="field-row-col" style="flex:2;">
                    <label class="field-label">Название</label>
                    <input type="text" id="holidayNewName" class="field-input" placeholder="Например: День России">
                </div>
            </div>
            <div class="field-actions">
                <button class="btn btn-secondary" onclick="closeHolidaysModal()">Закрыть</button>
                <button class="btn btn-primary" onclick="addHoliday()">Добавить</button>
            </div>
        </div>
    </div>

    <!-- Норма отпуска на сотрудника -->
    <div class="modal" id="leaveNormModal" style="display:none;">
        <div class="employee-modal-box" style="max-width: 360px;">
            <h3 id="leaveNormTitle" style="font-size: 18px; font-weight: 700; margin-bottom: 20px;">Норма отпуска</h3>
            <div class="field field-lg">
                <label class="field-label">Дней в год</label>
                <input type="number" id="leaveNormValue" min="0" max="60" class="field-input">
            </div>
            <div class="field-actions">
                <button class="btn btn-secondary" onclick="closeLeaveNormModal()">Отмена</button>
                <button class="btn btn-primary" onclick="submitLeaveNorm()">Сохранить</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <script src="common.js?v=20261002c"></script>
    <script src="icons.js?v=20260930l"></script>
    <script src="reminders.js?v=20260930l"></script>
    <script src="js/vacations.js?v=20261002r1"></script>
</body>
</html>
