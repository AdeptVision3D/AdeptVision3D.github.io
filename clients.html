<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
<script>try{var __t=localStorage.getItem("decardTheme")||"system";document.documentElement.setAttribute("data-theme",__t==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):__t);}catch(e){}(function(){var q=function(e){var v=e.viewTransition;if(v){["ready","finished","updateCallbackDone"].forEach(function(k){if(v[k]&&v[k].catch)v[k].catch(function(){});});}};addEventListener("pagereveal",q);addEventListener("pageswap",q);})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decard Studio — Клиенты</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F1830">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Geist:wght@500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/clients.css?v=20261002r1">
<link rel="stylesheet" href="glass.css?v=15">
<script src="glass.js?v=6" defer></script>
<script src="glass-fx.js?v=5" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <div class="header-left">
                    <a href="index.html" class="btn btn-back">← Назад</a>
                    <span class="page-title">Клиенты</span>
                </div>
                <div class="user-box" id="userBox" style="display:flex; align-items:center; gap:10px; font-size:13px; color: var(--text-secondary);"></div>
            </div>
        </header>

        <div class="clients-toolbar">
            <input type="text" class="clients-search" id="clientSearch" placeholder="Поиск по имени, телефону, email..." oninput="renderClients()">
            <button class="btn btn-primary" onclick="openClientFormModal()">+ Добавить клиента</button>
        </div>

        <div id="clientsList"></div>
    </div>

    <div class="modal" id="clientFormModal" style="display:none;">
        <div class="employee-modal-box" style="max-width: 460px;">
            <h3 id="clientFormTitle" style="font-size: 20px; font-weight: 700; margin-bottom: 20px;">Новый клиент</h3>
            <div class="field">
                <label class="field-label">Название/ФИО *</label>
                <input type="text" id="clientFormName" placeholder="Компания или ФИО" class="field-input">
            </div>
            <div class="field">
                <label class="field-label">Контактное лицо</label>
                <input type="text" id="clientFormContact" placeholder="Например: Иван, менеджер по стройке" class="field-input">
            </div>
            <div class="field-row">
                <div class="field-row-col">
                    <label class="field-label">Телефон</label>
                    <input type="text" id="clientFormPhone" placeholder="+7 ..." class="field-input">
                </div>
                <div class="field-row-col">
                    <label class="field-label">Email</label>
                    <input type="text" id="clientFormEmail" placeholder="mail@example.com" class="field-input">
                </div>
            </div>
            <div class="field field-lg">
                <label class="field-label">Заметка (необязательно)</label>
                <textarea id="clientFormNotes" rows="3" placeholder="Особенности работы с клиентом, договорённости и т.п." class="field-input field-textarea"></textarea>
            </div>
            <div class="field-actions">
                <button class="btn btn-secondary" onclick="closeClientFormModal()">Отмена</button>
                <button class="btn btn-primary" id="clientFormSubmitBtn" onclick="submitClientForm()">Создать</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <script src="common.js?v=20261002c"></script>
    <script src="icons.js?v=20260930l"></script>
    <script src="reminders.js?v=20260930l"></script>
    <script src="js/clients.js?v=20261002r1"></script>
</body>
</html>
