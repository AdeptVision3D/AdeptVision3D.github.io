<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decard Studio — Проект</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F1830">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Geist:wght@500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/project.css?v=20261002r1">
<link rel="stylesheet" href="glass.css?v=15">
<style>.container > header { view-transition-name: proj-card; } .theme-vt .container > header { view-transition-name: none; }</style>
<script src="glass.js?v=6" defer></script>
<script src="glass-fx.js?v=5" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
                    <a href="index.html" class="btn btn-back">← Назад</a>
                    <span class="project-title" id="projectTitle">Загрузка...</span>
                    <div class="theme-controls">
                        <button class="theme-btn" data-theme="light" onclick="setTheme('light')" title="Светлая тема"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/></svg></button>
                        <button class="theme-btn" data-theme="dark" onclick="setTheme('dark')" title="Тёмная тема"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
                        <button class="theme-btn" data-theme="system" onclick="setTheme('system')" title="Системная тема"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></button>
                    </div>
                </div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <a href="my.html" class="btn btn-secondary nav-my-link">Моё</a>
                    <button class="btn btn-secondary" onclick="openProjectLogModal()" title="Журнал изменений по проекту"><span data-icon="clipboard"></span><span class="btn-text">Журнал</span></button>
                    <a class="btn btn-secondary" id="projectHolstLink" href="#" target="_blank" rel="noopener noreferrer" style="display:none;" title="Материалы проекта в Holst">Holst</a>
                    <button class="btn btn-secondary" id="editProjectHolstBtn" onclick="editProjectHolst()" style="display:none;" title="Ссылка на материалы проекта в Holst">Ссылка Holst</button>
                    <button class="btn btn-secondary" id="bulkFramesBtn" onclick="openBulkFrames()" style="display:none;" title="Создать сразу несколько кадров списком">+ Несколько кадров</button>
                    <button class="btn btn-primary" id="newFrameBtn" onclick="createFrame()">+ Новый кадр</button>
                </div>
                <div class="user-box" id="userBox" style="display:flex; align-items:center; gap:10px; font-size:13px; color: var(--text-secondary);"></div>
            </div>
        </header>
        <div class="frames-toolbar"><div class="view-toggle" id="frameViewToggle"><button type="button" id="viewListBtn" onclick="setFrameView('list')">Список</button><button type="button" id="viewBoardBtn" onclick="setFrameView('board')">Доска</button></div></div>
        <div class="frames-grid" id="framesGrid"></div>
        <div class="frames-board" id="framesBoard" style="display:none;"></div>
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="mascot-wrap" id="emptyStateMascot"></div>
            <h3>Нет кадров</h3>
            <p>Создайте первый кадр для этого проекта</p>
        </div>
    </div>
    <div class="toast-container" id="toastContainer"></div>
    <div class="modal" id="projectLogModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" style="display:flex; align-items:center; gap:8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> Журнал изменений по проекту</h3>
                <button class="modal-close" onclick="closeProjectLogModal()">×</button>
            </div>
            <div class="modal-body" id="projectLogModalList"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeProjectLogModal()">Закрыть</button>
            </div>
        </div>
    </div>
    <div class="modal" id="bulkFramesModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Создать несколько кадров</h3>
                <button class="modal-close" onclick="closeBulkFrames()">×</button>
            </div>
            <div class="modal-body">
                <p style="font-size:13px; color:var(--text-secondary); margin-bottom:10px;">Каждый кадр с новой строки. Например: «Фасад, день», «Фасад, вечер», «Двор».</p>
                <textarea id="bulkFramesText" class="field-input field-textarea" rows="8" placeholder="Название кадра 1&#10;Название кадра 2&#10;Название кадра 3"></textarea>
                <div id="bulkFramesCount" style="font-size:12px; color:var(--text-secondary); margin-top:8px;"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeBulkFrames()">Отмена</button>
                <button class="btn btn-primary" id="bulkFramesSubmit" onclick="submitBulkFrames()">Создать</button>
            </div>
        </div>
    </div>
    <script src="common.js?v=20261002c"></script>
    <script src="icons.js?v=20260930l"></script>
    <script src="reminders.js?v=20260930l"></script>
    <script src="js/project.js?v=20261002r1"></script>
</body>
</html>
