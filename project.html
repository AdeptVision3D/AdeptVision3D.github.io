<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decard Pipeline — Проект</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F1830">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { padding: 40px; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { margin-bottom: 40px; border-bottom: 2px solid var(--border); padding-bottom: 24px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
        .project-title { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
        .btn-secondary { background: var(--card-bg); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--border); transform: translateY(-2px); }
        .btn-back { background: var(--card-bg); color: var(--text-primary); border: 1px solid var(--border); }
        .frames-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }
        .frame-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
        .frame-header-text { flex: 1; min-width: 0; }
        .frame-title { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; margin-bottom: 8px; }
        .frame-meta { font-size: 13px; color: var(--text-secondary); display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
        .frame-body { padding: 20px; }
        .frame-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .frame-card.priority { border-color: var(--danger); }
        .priority-badge { font-family: var(--font-mono); font-size: 11px; padding: 4px 12px 4px 9px; border-radius: 999px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; background: rgba(231, 76, 60, 0.12); color: var(--danger); }
        .btn-priority-on { color: var(--danger); border-color: var(--danger); }
        .assignee-badge { font-family: var(--font-mono); font-size: 11px; padding: 4px 12px 4px 9px; border-radius: 999px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; background: rgba(39, 67, 192, 0.1); color: var(--accent); }
        .assignee-select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-secondary); color: var(--text-primary); font-size: 13px; }
        .empty-state { text-align: center; padding: 80px 20px; color: var(--text-secondary); }
        .empty-state h3 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 8px; color: var(--text-primary); }
        .status-badge { font-family: var(--font-mono); font-size: 11px; padding: 4px 12px 4px 9px; border-radius: 999px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
        .status-not-started { background: var(--border); color: var(--text-secondary); }
        .status-in-progress { background: rgba(243, 156, 18, 0.15); color: var(--warning); }
        .status-done { background: rgba(39, 174, 96, 0.15); color: var(--success); }
        .deadline-badge { font-family: var(--font-mono); font-size: 11px; padding: 4px 12px 4px 9px; border-radius: 999px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
        .deadline-ok { background: rgba(39, 174, 96, 0.15); color: var(--success); }
        .deadline-soon { background: rgba(243, 156, 18, 0.15); color: var(--warning); }
        .deadline-urgent { background: rgba(231, 76, 60, 0.15); color: var(--danger); }
        .delivery-badge { font-family: var(--font-mono); font-size: 11px; padding: 4px 12px 4px 9px; border-radius: 999px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
        .delivery-on_time { background: rgba(39, 174, 96, 0.15); color: var(--success); }
        .delivery-late { background: rgba(231, 76, 60, 0.15); color: var(--danger); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--modal-overlay); backdrop-filter: blur(4px); z-index: 2000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--modal-bg); border-radius: 8px; padding: 32px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid var(--border); }
        .modal-title { font-size: 18px; font-weight: 700; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-secondary); transition: color 0.2s ease; padding: 4px; }
        .modal-close:hover { color: var(--text-primary); transform: scale(1.1); }
        .modal-body { margin-bottom: 24px; }
        .modal-footer { display: flex; gap: 12px; justify-content: flex-end; padding-top: 16px; border-top: 2px solid var(--border); }
        .log-entry { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
        .log-entry:last-child { border-bottom: none; }
        .log-time { color: var(--text-secondary); font-size: 12px; margin-bottom: 2px; }
        .log-desc { color: var(--text-primary); }
        .log-frame-tag { color: var(--accent); font-weight: 600; }
        @media (max-width: 768px) {
            .modal-content { padding: 20px; max-height: 88vh; }
        }
        @media (max-width: 768px) {
            body { padding: 20px; }
            .header-top { flex-direction: column; align-items: flex-start; }
            .frames-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
                    <a href="index.html" class="btn btn-back">← Назад</a>
                    <span class="project-title" id="projectTitle">Загрузка...</span>
                    <div class="theme-controls">
                        <button class="theme-btn" data-theme="light" onclick="setTheme('light')" title="Светлая тема"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/></svg></button>
                        <button class="theme-btn" data-theme="dark" onclick="setTheme('dark')" title="Тёмная тема"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
                        <button class="theme-btn" data-theme="system" onclick="setTheme('system')" title="Системная тема"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></button>
                    </div>
                </div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <a href="my.html" class="btn btn-secondary">Моё</a>
                    <button class="btn btn-secondary" onclick="openProjectLogModal()" title="Журнал изменений по проекту">📋 <span class="btn-text">Журнал</span></button>
                    <button class="btn btn-primary" id="newFrameBtn" onclick="createFrame()">+ Новый кадр</button>
                </div>
                <div class="user-box" id="userBox" style="display:flex; align-items:center; gap:10px; font-size:13px; color: var(--text-secondary);"></div>
            </div>
        </header>
        <div class="frames-grid" id="framesGrid"></div>
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="mascot-wrap" id="emptyStateMascot"></div>
            <h3>Нет кадров</h3>
            <p>Создайте первый кадр для этого проекта</p>
        </div>
    </div>
    <div class="toast-container" id="toastContainer"></div>
    <div class="modal" id="projectLogModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" style="display:flex; align-items:center; gap:8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> Журнал изменений по проекту</h3>
                <button class="modal-close" onclick="closeProjectLogModal()">×</button>
            </div>
            <div class="modal-body" id="projectLogModalList"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeProjectLogModal()">Закрыть</button>
            </div>
        </div>
    </div>
    <script src="common.js"></script>
    <script>
        let currentUser = null;

        async function requireAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return false; }
            const { data: profile, error } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
            if (error || !profile) { console.error(error); await supabaseClient.auth.signOut(); window.location.href = 'login.html'; return false; }
            currentUser = { id: profile.id, full_name: profile.full_name, role: profile.role, is_admin: !!profile.is_admin };
            renderUserBox();
            applyRolePermissions();
            return true;
        }

        function renderUserBox() {
            const box = document.getElementById('userBox');
            if (!box || !currentUser) return;
            box.innerHTML = `<span>${currentUser.full_name} · ${roleLabels[currentUser.role] || currentUser.role}</span>
                <button class="btn btn-secondary" onclick="doLogout()" style="padding:4px 10px; font-size:12px;">Выйти</button>`;
        }

        function applyRolePermissions() {
            const canManage = hasAdminAccess(currentUser) || ['lead', 'art_director', 'ceo'].includes(currentUser.role);
            const newBtn = document.getElementById('newFrameBtn');
            if (newBtn) newBtn.style.display = canManage ? '' : 'none';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id'); // теперь это uuid-строка, а не число

        // Проверка доступа: руководители/админ видят и открывают любой проект всегда.
        // Остальным вход закрыт, если у проекта назначена команда, а их в ней нет
        // (нет назначенной команды вообще — значит проект открыт всем, как раньше).
        async function checkProjectAccess() {
            const canManage = hasAdminAccess(currentUser) || ['lead', 'art_director', 'ceo'].includes(currentUser.role);
            if (canManage) return true;

            const { data: members, error } = await supabaseClient
                .from('project_members')
                .select('user_id')
                .eq('project_id', projectId);
            if (error) {
                // Не смогли проверить команду — не блокируем (как и раньше, до этой проверки)
                console.error(error);
                return true;
            }
            if (!members || members.length === 0) return true;
            const isMember = members.some(m => m.user_id === currentUser.id);
            if (!isMember) {
                window.location.href = 'index.html?denied=1';
                return false;
            }
            return true;
        }

        // ====== РАБОТА С ДАННЫМИ ЧЕРЕЗ SUPABASE ======

        async function getProject() {
            // withRetry — при обрыве связи (не при обычной ошибке БД) делает пару
            // повторных попыток вместо того, чтобы сразу показать пустую страницу
            const { data, error } = await withRetry(() => supabaseClient
                .from('projects')
                .select('*')
                .eq('id', projectId)
                .single());
            if (error) {
                console.error(error);
                return null;
            }
            return data;
        }

        // Сотрудники для назначения ответственного за кадр ("Моё") — загружаем один раз
        let allProfilesCache = [];
        async function loadProfilesCache() {
            const { data, error } = await supabaseClient.from('profiles').select('id, full_name').eq('is_active', true).order('full_name', { ascending: true });
            if (error) { console.error(error); return; }
            allProfilesCache = data || [];
        }

        async function assignFrame(frameId, userId) {
            const { error } = await supabaseClient.from('frames').update({ assigned_to: userId || null }).eq('id', frameId);
            if (error) {
                const msg = isNetworkError(error) ? 'Нет соединения — попробуйте ещё раз' : 'Не удалось назначить исполнителя';
                console.error(error); showToast(msg, 'error'); return;
            }
            const assignee = userId ? allProfilesCache.find(p => p.id === userId) : null;
            logFrameActivity(frameId, 'assign', assignee ? `Назначен исполнитель: ${assignee.full_name}` : 'Исполнитель снят', currentUser ? currentUser.full_name : null);
            showToast(userId ? 'Исполнитель назначен' : 'Исполнитель снят', 'success');
            renderFrames();
        }

        // Срок сдачи конкретного кадра (если пусто — используется срок проекта).
        // Быстрое редактирование через prompt(), как и у срока проекта на главной.
        async function editFrameDueDate(frameId, currentDueIso) {
            let currentDisplay = '';
            if (currentDueIso) {
                const [y, m, d] = currentDueIso.split('-');
                currentDisplay = `${d}.${m}.${y}`;
            }
            const raw = prompt('Срок сдачи кадра (ДД.ММ.ГГГГ), пусто — использовать срок проекта:', currentDisplay);
            if (raw === null) return; // отмена

            let dueIso = null;
            if (raw.trim()) {
                const parts = raw.trim().split('.');
                if (parts.length !== 3) { showToast('Неверный формат даты', 'error'); return; }
                const [d, m, y] = parts;
                dueIso = `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
            }
            const { error } = await supabaseClient.from('frames').update({ due_date: dueIso }).eq('id', frameId);
            if (error) { console.error(error); showToast('Не удалось изменить срок', 'error'); return; }
            logFrameActivity(frameId, 'due_date_change', dueIso ? `Установлен срок сдачи кадра: ${formatDateRu(dueIso)}` : 'Срок сдачи кадра сброшен (используется срок проекта)', currentUser ? currentUser.full_name : null);
            showToast('Срок обновлён', 'success');
            renderFrames();
        }

        async function getFrames() {
            const { data, error } = await withRetry(() => supabaseClient
                .from('frames')
                .select('*')
                .eq('project_id', projectId)
                .order('created_at', { ascending: false }));
            if (error) {
                console.error(error);
                showToast(isNetworkError(error) ? 'Нет соединения — проверьте сеть и обновите страницу' : 'Ошибка загрузки кадров', 'error');
                return [];
            }
            return data;
        }

        // Догружает этапы и задачи всех кадров проекта одним запросом (frame_stages → frame_tasks)
        // и считает для каждого кадра "выполнено/всего" — теперь у каждого кадра своё число задач,
        // так как задачи и этапы редактируются индивидуально (см. frame.html).
        async function getFramesProgress(frameIds) {
            if (frameIds.length === 0) return {};
            const { data, error } = await supabaseClient
                .from('frame_stages')
                .select('frame_id, frame_tasks(checked)')
                .in('frame_id', frameIds);
            if (error) {
                console.error(error);
                return {};
            }
            const progress = {};
            (data || []).forEach(stageRow => {
                if (!progress[stageRow.frame_id]) progress[stageRow.frame_id] = { total: 0, completed: 0 };
                const tasks = stageRow.frame_tasks || [];
                progress[stageRow.frame_id].total += tasks.length;
                progress[stageRow.frame_id].completed += tasks.filter(t => t.checked).length;
            });
            return progress;
        }

        async function createFrame() {
            const name = prompt('Название кадра:');
            if (!name) return;

            const { error } = await supabaseClient.from('frames').insert({
                project_id: projectId,
                name: name,
                status: 'not_started'
            });

            if (error) {
                console.error(error);
                showToast('Не удалось создать кадр', 'error');
                return;
            }
            showToast('Кадр создан!', 'success');
            renderFrames();
        }

        async function deleteFrame(frameId) {
            if (!confirm('Удалить кадр?')) return;
            const { error } = await supabaseClient.from('frames').delete().eq('id', frameId);
            if (error) {
                console.error(error);
                showToast('Не удалось удалить кадр', 'error');
                return;
            }
            showToast('Кадр удалён', 'warning');
            renderFrames();
        }

        async function setFrameStatus(frameId, status) {
            // completed_at фиксируем/сбрасываем вместе со статусом — нужно для
            // расчёта "сдано в срок / с опозданием" (см. getDeliveryStatus в common.js)
            const updates = { status: status };
            updates.completed_at = status === 'done' ? new Date().toISOString() : null;
            const { error } = await supabaseClient
                .from('frames')
                .update(updates)
                .eq('id', frameId);
            if (error) {
                const msg = isNetworkError(error) ? 'Нет соединения — попробуйте ещё раз' : 'Не удалось обновить статус';
                console.error(error); showToast(msg, 'error'); return;
            }
            logFrameActivity(frameId, 'frame_status_change', `Статус кадра изменён: ${getFrameStatusLabel(status)}`, currentUser ? currentUser.full_name : null);
            showToast(`Статус: ${getFrameStatusLabel(status)}`, 'success');
            renderFrames();
        }

        // "Горящий" кадр — ручная пометка приоритета, не связана со статусом/дедлайном
        // проекта. Ставить/снимать может любой (как и смену статуса выше) — это просто
        // сигнал "обратите внимание", а не право доступа.
        async function toggleFramePriority(frameId, currentlyPriority) {
            const { error } = await supabaseClient
                .from('frames')
                .update({ is_priority: !currentlyPriority })
                .eq('id', frameId);
            if (error) {
                console.error(error);
                showToast('Не удалось изменить приоритет', 'error');
                return;
            }
            logFrameActivity(frameId, 'priority_toggle', !currentlyPriority ? 'Кадр отмечен как горящий' : 'Пометка приоритета снята', currentUser ? currentUser.full_name : null);
            showToast(!currentlyPriority ? 'Кадр отмечен как горящий' : 'Пометка приоритета снята', 'success');
            renderFrames();
        }

        function getFrameStatusLabel(status) {
            if (status === 'done') return 'Готов';
            if (status === 'in_progress') return 'В работе';
            return 'Не начат';
        }
        function getFrameStatusClass(status) {
            if (status === 'done') return 'status-done';
            if (status === 'in_progress') return 'status-in-progress';
            return 'status-not-started';
        }

        async function renderFrames() {
            const project = await getProject();
            if (!project) {
                document.getElementById('projectTitle').textContent = 'Проект не найден';
                return;
            }
            document.getElementById('projectTitle').textContent = project.name;

            const frames = await getFrames();
            // Горящие кадры — наверх списка; порядок внутри каждой группы сохраняется
            // (Array.sort в JS стабилен), created_at desc уже задан запросом в getFrames()
            frames.sort((a, b) => (b.is_priority ? 1 : 0) - (a.is_priority ? 1 : 0));
            const progressMap = await getFramesProgress(frames.map(f => f.id));
            const canManageFrames = currentUser && (hasAdminAccess(currentUser) || ['lead', 'art_director', 'ceo'].includes(currentUser.role));
            const grid = document.getElementById('framesGrid');
            const empty = document.getElementById('emptyState');
            if (frames.length === 0) {
                grid.innerHTML = '';
                empty.style.display = 'block';
            } else {
                empty.style.display = 'none';
                grid.innerHTML = frames.map(f => {
                    const statusLabel = getFrameStatusLabel(f.status);
                    const statusClass = getFrameStatusClass(f.status);
                    const createdDisplay = f.created_at ? new Date(f.created_at).toLocaleDateString('ru-RU') : '';
                    const frameProgress = progressMap[f.id] || { total: 0, completed: 0 };
                    const progressPercent = frameProgress.total > 0 ? Math.round((frameProgress.completed / frameProgress.total) * 100) : 0;
                    const isPriority = !!f.is_priority;
                    const effectiveDue = getEffectiveDueDate(f, project.deadline);
                    const dueStatus = effectiveDue ? getDeadlineStatus(effectiveDue) : null;
                    const delivery = getDeliveryStatus(f, project.deadline);
                    const dueTitle = f.due_date ? 'Свой срок кадра (не срок проекта)' : 'Срок по умолчанию — дедлайн проекта';
                    const assignee = f.assigned_to ? allProfilesCache.find(p => p.id === f.assigned_to) : null;
                    const assigneeBadge = assignee ? `<span class="assignee-badge">${ICON.team} ${escapeHtml(assignee.full_name)}</span>` : '';
                    const assigneeSelect = canManageFrames ? `
                        <select class="assignee-select" onchange="assignFrame('${f.id}', this.value)" title="Назначить ответственного">
                            <option value="">Не назначено</option>
                            ${allProfilesCache.map(p => `<option value="${p.id}" ${f.assigned_to === p.id ? 'selected' : ''}>${escapeHtml(p.full_name)}</option>`).join('')}
                        </select>` : '';
                    return `
                        <div class="frame-card viewfinder-card ${isPriority ? 'priority' : ''}">
                            <div class="frame-header">
                                <div class="frame-header-text">
                                    <div class="frame-title">${escapeHtml(f.name)}</div>
                                    <div class="frame-meta">
                                        <span style="display:inline-flex;align-items:center;gap:5px;">${ICON.calendar}${createdDisplay}</span>
                                        <span class="status-badge ${statusClass}"><span class="badge-dot"></span>${statusLabel}</span>
                                        <span>${frameProgress.completed}/${frameProgress.total} задач</span>
                                        ${isPriority ? `<span class="priority-badge">${ICON.warning} Горит</span>` : ''}
                                        ${f.status !== 'done' && effectiveDue ? `<span class="deadline-badge deadline-${dueStatus}" title="${dueTitle}"><span class="badge-dot"></span>${getDeadlineLabel(dueStatus)}: ${formatDateRu(effectiveDue)}</span>` : ''}
                                        ${delivery === 'on_time' ? `<span class="delivery-badge delivery-on_time">✓ Сдано в срок</span>` : ''}
                                        ${delivery === 'late' ? `<span class="delivery-badge delivery-late">⚠ Сдано с опозданием</span>` : ''}
                                        ${!canManageFrames ? assigneeBadge : ''}
                                    </div>
                                </div>
                                <div class="progress-ring" style="--percent:${progressPercent}"><span class="progress-ring-label">${progressPercent}%</span></div>
                            </div>
                            <div class="frame-body">
                                ${canManageFrames ? `<div style="margin-bottom:12px;">${assigneeSelect}</div>` : ''}
                                <div class="frame-actions">
                                    <a href="frame.html?project=${projectId}&frame=${f.id}" class="btn btn-primary">Открыть чек-лист</a>
                                    <button class="btn btn-secondary ${isPriority ? 'btn-priority-on' : ''}" onclick="toggleFramePriority('${f.id}', ${isPriority})" title="${isPriority ? 'Снять пометку приоритета' : 'Отметить как горящий'}">${ICON.warning}</button>
                                    <button class="btn btn-secondary" onclick="setFrameStatus('${f.id}', 'in_progress')">${ICON.clock} В работу</button>
                                    <button class="btn btn-secondary" onclick="setFrameStatus('${f.id}', 'done')">${ICON.check} Готов</button>
                                    ${canManageFrames ? `<button class="btn btn-secondary" onclick="editFrameDueDate('${f.id}', ${f.due_date ? `'${f.due_date}'` : 'null'})" title="Срок сдачи кадра">${ICON.calendar} Срок</button>` : ''}
                                    ${canManageFrames ? `<button class="btn btn-secondary" onclick="deleteFrame('${f.id}')" style="color: var(--danger);">${ICON.trash}</button>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        // ====== Журнал изменений по проекту — объединяет записи по всем кадрам проекта
        // и записи уровня самого проекта (стоп/снятие стопа, завершение, команда) ======
        async function openProjectLogModal() {
            document.getElementById('projectLogModal').classList.add('active');
            const listEl = document.getElementById('projectLogModalList');
            listEl.innerHTML = `<p style="color: var(--text-secondary); font-size: 13px; text-align: center; padding: 20px 0;">${randomLoadingPhrase()}</p>`;

            const frames = await getFrames();
            const frameIds = frames.map(f => f.id);
            const frameNameMap = Object.fromEntries(frames.map(f => [f.id, f.name]));

            const queries = [
                supabaseClient.from('frame_activity_log').select('*').eq('project_id', projectId).order('created_at', { ascending: false }).limit(100)
            ];
            if (frameIds.length > 0) {
                queries.push(supabaseClient.from('frame_activity_log').select('*').in('frame_id', frameIds).order('created_at', { ascending: false }).limit(200));
            }
            const results = await Promise.all(queries);
            const failed = results.find(r => r.error);
            if (failed) {
                console.error(failed.error);
                listEl.innerHTML = '<p style="color: var(--danger); font-size: 13px;">Не удалось загрузить журнал</p>';
                return;
            }

            let entries = results.flatMap(r => r.data || []);
            const seen = new Set();
            entries = entries.filter(e => { if (seen.has(e.id)) return false; seen.add(e.id); return true; });
            entries.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            entries = entries.slice(0, 200);

            if (entries.length === 0) {
                listEl.innerHTML = '<p style="color: var(--text-secondary); font-size: 13px; text-align: center; padding: 40px 0;">Изменений пока нет</p>';
                return;
            }
            listEl.innerHTML = entries.map(entry => {
                const time = new Date(entry.created_at).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                const frameLabel = entry.frame_id ? (frameNameMap[entry.frame_id] || 'Удалённый кадр') : 'Проект';
                return `<div class="log-entry"><div class="log-time">${time}${entry.actor_name ? ' · ' + escapeHtml(entry.actor_name) : ''} · <span class="log-frame-tag">${escapeHtml(frameLabel)}</span></div><div class="log-desc">${escapeHtml(entry.description)}</div></div>`;
            }).join('');
        }
        function closeProjectLogModal() { document.getElementById('projectLogModal').classList.remove('active'); }

        document.addEventListener('DOMContentLoaded', async function() {
            loadTheme();
            document.getElementById('emptyStateMascot').innerHTML = MASCOT_SVG;
            document.getElementById('projectTitle').textContent = randomLoadingPhrase();
            const ok = await requireAuth();
            if (!ok) return;
            const allowed = await checkProjectAccess();
            if (!allowed) return;
            await loadProfilesCache();
            renderFrames();
            initDeadlineReminders(currentUser);
            showToast('Добро пожаловать!', 'success');
        });
    </script>
</body>
</html>
