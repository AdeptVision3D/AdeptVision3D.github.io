<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decard Studio — Консоль ошибок</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F1830">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { padding: 40px; }
        .container { max-width: 1100px; margin: 0 auto; }
        header { margin-bottom: 32px; border-bottom: 2px solid var(--border); padding-bottom: 24px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
        .header-left { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .page-title { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
        .btn-back { background: var(--card-bg); color: var(--text-primary); border: 1px solid var(--border); }

        .panel { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 6px; box-shadow: var(--card-shadow); overflow: hidden; margin-bottom: 24px; }
        .panel-header { padding: 16px 20px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; }
        .panel-body { padding: 4px 0; }
        .panel-empty { padding: 28px 20px; color: var(--text-secondary); font-size: 13px; text-align: center; }

        .err-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .err-search { padding: 7px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-primary); font-size: 13px; min-width: 220px; }

        .err-row { padding: 12px 20px; border-bottom: 1px solid var(--border); font-size: 13px; }
        .err-row:last-child { border-bottom: none; }
        .err-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
        .err-message { font-weight: 600; color: var(--danger); word-break: break-word; }
        .err-meta { color: var(--text-secondary); font-size: 12px; margin-top: 4px; white-space: nowrap; }
        .err-sub { color: var(--text-secondary); font-size: 12px; margin-top: 4px; }
        .err-count-badge { font-family: var(--font-mono); font-size: 11px; padding: 2px 9px; border-radius: 999px; background: rgba(231, 76, 60, 0.15); color: var(--danger); font-weight: 700; white-space: nowrap; }
        .err-stack-toggle { border: none; background: none; color: var(--accent); cursor: pointer; font-size: 12px; padding: 0; margin-top: 6px; }
        .err-stack { display: none; margin-top: 8px; background: var(--bg-secondary); border-radius: 6px; padding: 10px 12px; font-family: var(--font-mono); font-size: 11px; white-space: pre-wrap; word-break: break-word; color: var(--text-secondary); max-height: 240px; overflow-y: auto; }
        .err-stack.open { display: block; }
        .err-del-btn { border: none; background: none; color: var(--text-secondary); cursor: pointer; padding: 2px 4px; border-radius: 4px; flex-shrink: 0; }
        .err-del-btn:hover { color: var(--danger); background: rgba(231, 76, 60, 0.1); }
        .err-row.resolved { opacity: 0.55; }
        .err-row.resolved .err-message { color: var(--text-secondary); }
        .err-resolve-btn { border: 1px solid var(--border); background: var(--card-bg); color: var(--text-secondary); cursor: pointer; padding: 4px 10px; border-radius: 5px; font-size: 11.5px; font-weight: 600; flex-shrink: 0; white-space: nowrap; }
        .err-resolve-btn:hover { border-color: var(--success); color: var(--success); }
        .err-resolve-btn.is-resolved { background: rgba(39, 174, 96, 0.12); border-color: rgba(39, 174, 96, 0.4); color: var(--success); }
        .err-filter-group { display: flex; gap: 6px; }
        .err-filter-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-secondary); font-size: 12px; font-weight: 600; cursor: pointer; }
        .err-filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .no-access { text-align: center; padding: 100px 20px; color: var(--text-secondary); }
        .no-access h3 { color: var(--text-primary); margin-bottom: 8px; }

        @media (max-width: 768px) {
            body { padding: 20px; }
            .header-top { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container" id="pageContainer" style="display:none;">
        <header>
            <div class="header-top">
                <div class="header-left">
                    <a href="index.html" class="btn btn-back">← Назад</a>
                    <span class="page-title">Консоль ошибок</span>
                </div>
                <div class="user-box" id="userBox" style="display:flex; align-items:center; gap:10px; font-size:13px; color: var(--text-secondary);"></div>
            </div>
        </header>

        <div class="panel">
            <div class="panel-header">
                <span id="errCountLabel">Загрузка…</span>
                <div class="err-toolbar">
                    <div class="err-filter-group">
                        <button class="err-filter-btn active" data-filter="active" onclick="setErrorFilter('active')">Активные</button>
                        <button class="err-filter-btn" data-filter="resolved" onclick="setErrorFilter('resolved')">Решённые</button>
                        <button class="err-filter-btn" data-filter="all" onclick="setErrorFilter('all')">Все</button>
                    </div>
                    <input type="text" id="errSearch" class="err-search" placeholder="Поиск по тексту ошибки / странице" oninput="renderErrors()">
                    <button class="btn btn-secondary" style="padding:6px 12px; font-size:12px;" onclick="refreshErrors()">Обновить</button>
                    <button class="btn btn-secondary" style="padding:6px 12px; font-size:12px; color:var(--danger);" onclick="clearOldErrors()">Удалить старше 30 дней</button>
                </div>
            </div>
            <div class="panel-body" id="errorsPanel"></div>
        </div>
    </div>
    <div class="no-access" id="noAccess" style="display:none;">
        <h3>Доступ ограничен</h3>
        <p>Консоль ошибок доступна только администраторам.</p>
        <p style="margin-top:16px;"><a href="index.html" class="btn btn-primary" style="display:inline-flex;">На главную</a></p>
    </div>
    <div class="toast-container" id="toastContainer"></div>
    <script src="common.js?v=20260930l"></script>
    <script src="icons.js?v=20260930l"></script>
    <script src="reminders.js?v=20260930l"></script>
    <script>
        let currentUser = null;
        let errorsCache = [];
        let profileNameMap = {};

        async function requireAuth() {
            return !!(await initAuthedPage());
        }

        // Единый источник списка страниц — BUG_PAGE_LABELS в common.js (используется
        // и в форме bugs.html). Здесь дополняем только страницами, которых нет в форме
        // "сообщить об ошибке" (их нельзя выбрать вручную, но ошибки на них всё равно
        // логируются автоматически), чтобы не держать вторую копию всего списка.
        const PAGE_LABELS_ERR = {
            ...BUG_PAGE_LABELS,
            'login.html': 'Вход',
            'bugs.html': 'Сообщить об ошибке',
            'error-console.html': 'Консоль ошибок',
            'deals.html': 'Сделки'
        };

        async function loadErrors() {
            const { data: logs, error } = await supabaseClient
                .from('error_logs')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(300);
            if (error) { console.error(error); showToast('Не удалось загрузить лог ошибок', 'error'); return; }
            errorsCache = logs || [];

            const userIds = [...new Set(errorsCache.map(e => e.user_id).filter(Boolean))];
            profileNameMap = {};
            if (userIds.length > 0) {
                const { data: profiles, error: profErr } = await supabaseClient.from('profiles').select('id, full_name').in('id', userIds);
                if (profErr) console.error(profErr);
                (profiles || []).forEach(p => { profileNameMap[p.id] = p.full_name; });
            }
            renderErrors();
        }

        async function refreshErrors() {
            document.getElementById('errCountLabel').textContent = 'Загрузка…';
            await loadErrors();
            showToast('Обновлено', 'success');
        }

        function fmtErrTime(iso) {
            return new Date(iso).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        let errorFilter = 'active'; // active | resolved | all — по умолчанию показываем только непофикшенные
        function setErrorFilter(filter) {
            errorFilter = filter;
            document.querySelectorAll('.err-filter-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.filter === filter));
            renderErrors();
        }

        function renderErrors() {
            const query = (document.getElementById('errSearch').value || '').trim().toLowerCase();
            let filtered = errorFilter === 'active' ? errorsCache.filter(e => !e.resolved)
                : errorFilter === 'resolved' ? errorsCache.filter(e => e.resolved)
                : errorsCache;
            if (query) filtered = filtered.filter(e => (e.message || '').toLowerCase().includes(query) || (e.page || '').toLowerCase().includes(query));

            const activeCount = errorsCache.filter(e => !e.resolved).length;
            document.getElementById('errCountLabel').textContent = `Активных ошибок: ${activeCount} · всего за последние 300 записей: ${errorsCache.length}${query ? ` · показано: ${filtered.length}` : ''}`;

            const panel = document.getElementById('errorsPanel');
            if (filtered.length === 0) {
                let emptyText = 'Ничего не найдено по запросу';
                if (!query) {
                    emptyText = errorFilter === 'active' ? 'Активных ошибок нет — всё разобрано 🎉'
                        : errorFilter === 'resolved' ? 'Решённых ошибок пока нет'
                        : 'Ошибок пока не зафиксировано — это хороший знак';
                }
                panel.innerHTML = `<div class="panel-empty">${emptyText}</div>`;
                return;
            }

            panel.innerHTML = filtered.map((e, idx) => {
                const who = e.user_id ? (profileNameMap[e.user_id] || 'Бывший сотрудник') : 'Гость / до входа';
                const pageLabel = PAGE_LABELS_ERR[e.page] || e.page || '—';
                const stackId = `errStack${idx}`;
                const resolvedInfo = e.resolved ? `<div class="err-sub">✓ Решено ${e.resolved_at ? fmtErrTime(e.resolved_at) : ''}${e.resolved_by && profileNameMap[e.resolved_by] ? ' · ' + escapeHtml(profileNameMap[e.resolved_by]) : ''}</div>` : '';
                return `
                <div class="err-row ${e.resolved ? 'resolved' : ''}">
                    <div class="err-top">
                        <div style="min-width:0;">
                            <div class="err-message">${escapeHtml(e.message)}</div>
                            <div class="err-sub">${escapeHtml(pageLabel)} · ${escapeHtml(who)}</div>
                            ${resolvedInfo}
                        </div>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span class="err-meta">${fmtErrTime(e.created_at)}</span>
                            <button class="err-resolve-btn ${e.resolved ? 'is-resolved' : ''}" onclick="toggleErrorResolved('${e.id}', ${!e.resolved})">${e.resolved ? '✓ Решено' : 'Отметить решённой'}</button>
                            <button class="err-del-btn" title="Удалить запись" onclick="deleteErrorLog('${e.id}')">${ICON.trash}</button>
                        </div>
                    </div>
                    ${e.stack ? `<button class="err-stack-toggle" onclick="toggleStack('${stackId}')">Показать стек</button><div class="err-stack" id="${stackId}">${escapeHtml(e.stack)}</div>` : ''}
                </div>`;
            }).join('');
        }

        async function toggleErrorResolved(id, resolved) {
            const payload = resolved
                ? { resolved: true, resolved_at: new Date().toISOString(), resolved_by: currentUser.id }
                : { resolved: false, resolved_at: null, resolved_by: null };
            const { error } = await supabaseClient.from('error_logs').update(payload).eq('id', id);
            if (error) { console.error(error); showToast('Не удалось обновить статус', 'error'); return; }
            const item = errorsCache.find(e => e.id === id);
            if (item) Object.assign(item, payload);
            showToast(resolved ? 'Отмечено решённой' : 'Возвращено в активные', 'success');
            renderErrors();
        }

        function toggleStack(id) {
            const el = document.getElementById(id);
            if (el) el.classList.toggle('open');
        }

        async function deleteErrorLog(id) {
            const { error } = await supabaseClient.from('error_logs').delete().eq('id', id);
            if (error) { console.error(error); showToast('Не удалось удалить запись', 'error'); return; }
            errorsCache = errorsCache.filter(e => e.id !== id);
            renderErrors();
        }

        async function clearOldErrors() {
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - 30);
            if (!confirm('Удалить все записи об ошибках старше 30 дней?')) return;
            const { error } = await supabaseClient.from('error_logs').delete().lt('created_at', cutoff.toISOString());
            if (error) { console.error(error); showToast('Не удалось очистить лог', 'error'); return; }
            showToast('Старые записи удалены', 'success');
            await loadErrors();
        }

        document.addEventListener('DOMContentLoaded', async function() {
            loadTheme();
            const ok = await requireAuth();
            if (!ok) return;
            initDeadlineReminders(currentUser);

            if (!hasAdminAccess(currentUser)) {
                document.getElementById('noAccess').style.display = 'block';
                return;
            }
            document.getElementById('pageContainer').style.display = 'block';
            await loadErrors();
        });
    </script>
</body>
</html>
