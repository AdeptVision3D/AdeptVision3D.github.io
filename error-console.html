<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
<script>try{var __t=localStorage.getItem("decardTheme")||"system";document.documentElement.setAttribute("data-theme",__t==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):__t);}catch(e){}(function(){var q=function(e){var v=e.viewTransition;if(v){["ready","finished","updateCallbackDone"].forEach(function(k){if(v[k]&&v[k].catch)v[k].catch(function(){});});}};addEventListener("pagereveal",q);addEventListener("pageswap",q);})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decard Studio — Консоль ошибок</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F1830">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Geist:wght@500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/error-console.css?v=20261002r1">
<link rel="stylesheet" href="glass.css?v=15">
<script src="glass.js?v=6" defer></script>
<script src="glass-fx.js?v=5" defer></script>
</head>
<body>
    <div class="container" id="pageContainer" style="display:none;">
        <header>
            <div class="header-top">
                <div class="header-left">
                    <a href="index.html" class="btn btn-back">← Назад</a>
                    <span class="page-title">Консоль ошибок</span>
                </div>
                <div class="user-box" id="userBox" style="display:flex; align-items:center; gap:10px; font-size:13px; color: var(--text-secondary);"></div>
            </div>
        </header>

        <div class="panel">
            <div class="panel-header">
                <span id="errCountLabel">Загрузка…</span>
                <div class="err-toolbar">
                    <div class="err-filter-group">
                        <button class="err-filter-btn active" data-filter="active" onclick="setErrorFilter('active')">Активные</button>
                        <button class="err-filter-btn" data-filter="resolved" onclick="setErrorFilter('resolved')">Решённые</button>
                        <button class="err-filter-btn" data-filter="all" onclick="setErrorFilter('all')">Все</button>
                    </div>
                    <input type="text" id="errSearch" class="err-search" placeholder="Поиск по тексту ошибки / странице" oninput="renderErrors()">
                    <button class="btn btn-secondary" style="padding:6px 12px; font-size:12px;" onclick="refreshErrors()">Обновить</button>
                    <button class="btn btn-secondary" style="padding:6px 12px; font-size:12px; color:var(--danger);" onclick="clearOldErrors()">Удалить старше 30 дней</button>
                </div>
            </div>
            <div class="panel-body" id="errorsPanel"></div>
        </div>
    </div>
    <div class="no-access" id="noAccess" style="display:none;">
        <h3>Доступ ограничен</h3>
        <p>Консоль ошибок доступна только администраторам.</p>
        <p style="margin-top:16px;"><a href="index.html" class="btn btn-primary" style="display:inline-flex;">На главную</a></p>
    </div>
    <div class="toast-container" id="toastContainer"></div>
    <script src="common.js?v=20261002c"></script>
    <script src="icons.js?v=20260930l"></script>
    <script src="reminders.js?v=20260930l"></script>
    <script src="js/error-console.js?v=20261002r1"></script>
</body>
</html>
