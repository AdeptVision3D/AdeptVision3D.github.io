<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decard Pipeline — Аналитика</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { padding: 40px; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { margin-bottom: 32px; border-bottom: 2px solid var(--border); padding-bottom: 24px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
        .header-left { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .page-title { font-size: 24px; font-weight: 700; }
        .btn-secondary { background: var(--card-bg); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--border); transform: translateY(-2px); }
        .btn-back { background: var(--card-bg); color: var(--text-primary); border: 1px solid var(--border); }

        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--card-border); box-shadow: var(--card-shadow); }
        .stat-number { font-size: 30px; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

        .panels-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; margin-bottom: 24px; align-items: start; }
        @media (max-width: 900px) { .panels-grid { grid-template-columns: 1fr; } }

        .panel { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 6px; box-shadow: var(--card-shadow); overflow: hidden; }
        .panel-header { padding: 16px 20px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .panel-body { padding: 8px 0; }
        .panel-empty { padding: 24px 20px; color: var(--text-secondary); font-size: 13px; text-align: center; }

        .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--border); font-size: 13px; }
        .row:last-child { border-bottom: none; }
        .row-title { font-weight: 600; }
        .row-sub { color: var(--text-secondary); font-size: 12px; margin-top: 2px; }

        .deadline-badge { font-family: var(--font-mono); font-size: 11px; padding: 4px 12px 4px 9px; border-radius: 999px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
        .deadline-ok { background: rgba(39, 174, 96, 0.15); color: var(--success); }
        .deadline-soon { background: rgba(243, 156, 18, 0.15); color: var(--warning); }
        .deadline-urgent { background: rgba(231, 76, 60, 0.15); color: var(--danger); }

        .person-row { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
        .person-row:last-child { border-bottom: none; }
        .person-name { font-weight: 600; font-size: 13px; flex-shrink: 0; width: 150px; }
        .person-bar-track { flex: 1; height: 8px; background: var(--progress-bar-bg); border-radius: 4px; overflow: hidden; }
        .person-bar-fill { height: 100%; background: var(--accent-gradient); border-radius: 4px; }
        .person-count { font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); width: 60px; text-align: right; flex-shrink: 0; }

        .activity-log { max-height: 480px; overflow-y: auto; }
        .log-entry { padding: 10px 20px; border-bottom: 1px solid var(--border); font-size: 13px; }
        .log-entry:last-child { border-bottom: none; }
        .log-time { color: var(--text-secondary); font-size: 12px; margin-bottom: 2px; }
        .log-desc { color: var(--text-primary); }
        .log-context { color: var(--text-secondary); font-size: 12px; }

        .no-access { text-align: center; padding: 100px 20px; color: var(--text-secondary); }
        .no-access h3 { color: var(--text-primary); margin-bottom: 8px; }

        @media (max-width: 768px) {
            body { padding: 20px; }
            .header-top { flex-direction: column; align-items: flex-start; }
            .person-name { width: 100px; }
        }
    </style>
</head>
<body>
    <div class="container" id="pageContainer" style="display:none;">
        <header>
            <div class="header-top">
                <div class="header-left">
                    <a href="index.html" class="btn btn-back">← Назад</a>
                    <span class="page-title">Аналитика</span>
                </div>
                <div class="user-box" id="userBox" style="display:flex; align-items:center; gap:10px; font-size:13px; color: var(--text-secondary);"></div>
            </div>
        </header>

        <div class="stats" id="statsRow"></div>

        <div class="panels-grid">
            <div class="panel">
                <div class="panel-header">Дедлайны по всем проектам</div>
                <div class="panel-body" id="deadlinesPanel"></div>
            </div>
            <div class="panel">
                <div class="panel-header">Активность за 30 дней (по сотрудникам)</div>
                <div class="panel-body" id="activityByPersonPanel"></div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">Последние действия по всем кадрам</div>
            <div class="panel-body activity-log" id="recentActivityPanel"></div>
        </div>
    </div>
    <div class="no-access" id="noAccess" style="display:none;">
        <h3>Доступ ограничен</h3>
        <p>Аналитика доступна тимлидам, арт-директору и генеральному директору.</p>
        <p style="margin-top:16px;"><a href="index.html" class="btn btn-primary" style="display:inline-flex;">На главную</a></p>
    </div>
    <div class="toast-container" id="toastContainer"></div>
    <script src="common.js"></script>
    <script>
        let currentUser = null;

        async function requireAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return false; }
            const { data: profile, error } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
            if (error || !profile) { console.error(error); await supabaseClient.auth.signOut(); window.location.href = 'login.html'; return false; }
            currentUser = { id: profile.id, full_name: profile.full_name, role: profile.role };
            renderUserBox();
            return true;
        }

        function renderUserBox() {
            const box = document.getElementById('userBox');
            if (!box || !currentUser) return;
            box.innerHTML = `<span>${currentUser.full_name} · ${roleLabels[currentUser.role] || currentUser.role}</span>
                <button class="btn btn-secondary" onclick="doLogout()" style="padding:4px 10px; font-size:12px;">Выйти</button>`;
        }

        // Аналитика — просмотр для тех, кто управляет проектами (те же роли, что видят "+ Новый проект")
        function canViewAnalytics() { return currentUser && ['lead', 'art_director', 'ceo'].includes(currentUser.role); }

        // ====== Сбор данных со всего пайплайна ======

        // Загружает все проекты, все кадры и прогресс задач по каждому кадру одним проходом,
        // плюс лог активности по всем кадрам сразу (а не по одному кадру, как в project.html/frame.html)
        async function loadAllData() {
            const { data: projects, error: projErr } = await supabaseClient.from('projects').select('*');
            if (projErr) { console.error(projErr); showToast('Ошибка загрузки проектов', 'error'); return null; }

            const { data: frames, error: framesErr } = await supabaseClient.from('frames').select('*');
            if (framesErr) { console.error(framesErr); showToast('Ошибка загрузки кадров', 'error'); return null; }

            const frameIds = frames.map(f => f.id);
            let taskProgressByFrame = {};
            if (frameIds.length > 0) {
                const { data: stageRows, error: stageErr } = await supabaseClient
                    .from('frame_stages')
                    .select('frame_id, frame_tasks(checked)')
                    .in('frame_id', frameIds);
                if (stageErr) { console.error(stageErr); }
                (stageRows || []).forEach(row => {
                    if (!taskProgressByFrame[row.frame_id]) taskProgressByFrame[row.frame_id] = { total: 0, completed: 0 };
                    const tasks = row.frame_tasks || [];
                    taskProgressByFrame[row.frame_id].total += tasks.length;
                    taskProgressByFrame[row.frame_id].completed += tasks.filter(t => t.checked).length;
                });
            }

            // Лог активности по всем кадрам сразу — здесь и берём "кто что делал"
            // (в базе нет отдельного поля "исполнитель задачи", поэтому активность
            // считаем по логу действий, а не по формальному назначению задач)
            const { data: activity, error: actErr } = await supabaseClient
                .from('frame_activity_log')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(500);
            if (actErr) console.error(actErr);

            return { projects, frames, taskProgressByFrame, activity: activity || [] };
        }

        function renderStats(projects, frames, taskProgressByFrame) {
            const totalProjects = projects.length;
            const activeProjects = projects.filter(p => !p.completed).length;
            const completedProjects = projects.filter(p => p.completed).length;
            const totalFrames = frames.length;
            const framesByStatus = { not_started: 0, in_progress: 0, done: 0 };
            frames.forEach(f => { framesByStatus[f.status] = (framesByStatus[f.status] || 0) + 1; });

            let totalTasks = 0, completedTasks = 0;
            Object.values(taskProgressByFrame).forEach(p => { totalTasks += p.total; completedTasks += p.completed; });
            const overallPercent = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

            const cards = [
                { number: activeProjects, label: 'Активных проектов' },
                { number: completedProjects, label: 'Завершено проектов' },
                { number: totalFrames, label: 'Кадров всего' },
                { number: framesByStatus.in_progress || 0, label: 'Кадров в работе' },
                { number: framesByStatus.done || 0, label: 'Кадров готово' },
                { number: `${overallPercent}%`, label: 'Задач выполнено всего' }
            ];
            document.getElementById('statsRow').innerHTML = cards.map(c => `
                <div class="stat-card">
                    <div class="stat-number">${c.number}</div>
                    <div class="stat-label">${c.label}</div>
                </div>
            `).join('');
        }

        function renderDeadlines(projects) {
            const panel = document.getElementById('deadlinesPanel');
            const withDeadline = projects
                .filter(p => !p.completed && p.deadline)
                .map(p => ({ ...p, status: getDeadlineStatus(p.deadline) }))
                .sort((a, b) => new Date(a.deadline) - new Date(b.deadline));

            if (withDeadline.length === 0) {
                panel.innerHTML = '<div class="panel-empty">Нет активных проектов с дедлайном</div>';
                return;
            }
            panel.innerHTML = withDeadline.map(p => `
                <div class="row">
                    <div>
                        <div class="row-title">${escapeHtml(p.name)}</div>
                        <div class="row-sub">${formatDateRu(p.deadline)}</div>
                    </div>
                    <span class="deadline-badge deadline-${p.status}"><span class="badge-dot"></span>${getDeadlineLabel(p.status)}</span>
                </div>
            `).join('');
        }

        function renderActivityByPerson(activity) {
            const panel = document.getElementById('activityByPersonPanel');
            const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
            const counts = {};
            activity.forEach(entry => {
                if (!entry.actor_name) return;
                if (new Date(entry.created_at).getTime() < cutoff) return;
                counts[entry.actor_name] = (counts[entry.actor_name] || 0) + 1;
            });
            const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
            if (entries.length === 0) {
                panel.innerHTML = '<div class="panel-empty">Действий за последние 30 дней пока нет</div>';
                return;
            }
            const maxCount = entries[0][1];
            panel.innerHTML = entries.map(([name, count]) => `
                <div class="person-row">
                    <span class="person-name">${escapeHtml(name)}</span>
                    <div class="person-bar-track"><div class="person-bar-fill" style="width:${Math.round((count / maxCount) * 100)}%"></div></div>
                    <span class="person-count">${count} действ.</span>
                </div>
            `).join('');
        }

        function renderRecentActivity(activity, frames, projects) {
            const panel = document.getElementById('recentActivityPanel');
            if (activity.length === 0) {
                panel.innerHTML = '<div class="panel-empty">Изменений пока нет</div>';
                return;
            }
            const frameById = {};
            frames.forEach(f => { frameById[f.id] = f; });
            const projectById = {};
            projects.forEach(p => { projectById[p.id] = p; });

            panel.innerHTML = activity.slice(0, 60).map(entry => {
                const time = new Date(entry.created_at).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                const frame = frameById[entry.frame_id];
                const project = frame ? projectById[frame.project_id] : null;
                const context = [project ? project.name : null, frame ? frame.name : null].filter(Boolean).join(' → ');
                return `<div class="log-entry">
                    <div class="log-time">${time}${entry.actor_name ? ' · ' + escapeHtml(entry.actor_name) : ''}</div>
                    <div class="log-desc">${escapeHtml(entry.description)}</div>
                    ${context ? `<div class="log-context">${escapeHtml(context)}</div>` : ''}
                </div>`;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', async function() {
            loadTheme();
            const ok = await requireAuth();
            if (!ok) return;

            if (!canViewAnalytics()) {
                document.getElementById('noAccess').style.display = 'block';
                return;
            }
            document.getElementById('pageContainer').style.display = 'block';

            const data = await loadAllData();
            if (!data) return;
            const { projects, frames, taskProgressByFrame, activity } = data;

            renderStats(projects, frames, taskProgressByFrame);
            renderDeadlines(projects);
            renderActivityByPerson(activity);
            renderRecentActivity(activity, frames, projects);
        });
    </script>
</body>
</html>
