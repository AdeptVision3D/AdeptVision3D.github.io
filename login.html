<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decard Pipeline — Вход</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600\&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex; align-items: center; justify-content: center; padding: 40px;
            background-image: radial-gradient(circle at 20% 30%, rgba(39, 67, 192, 0.05) 0%, transparent 50%), radial-gradient(circle at 80% 70%, rgba(74, 111, 232, 0.05) 0%, transparent 50%);
        }
        .login-box { max-width: 480px; width: 100%; }
        .logo { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 8px; letter-spacing: 2px; text-transform: uppercase; }
        .logo span { color: var(--accent); }
        .subtitle { text-align: center; color: var(--text-secondary); font-size: 14px; margin-bottom: 32px; }
        .people-list { display: flex; flex-direction: column; gap: 10px; }
        .person-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; box-shadow: var(--card-shadow); overflow: hidden; transition: all 0.2s ease; position: relative; }
        .person-card::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 60%; background: linear-gradient(to top, rgba(var(--accent-rgb), 0.14), transparent); opacity: 0; transition: opacity 0.35s ease; pointer-events: none; z-index: -1; }
        .person-card:hover::after { opacity: 1; }
        .person-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; cursor: pointer; }
        .person-row:hover { background: rgba(39, 67, 192, 0.05); }
        .person-name { font-size: 15px; font-weight: 600; }
        .role-badge { font-family: var(--font-mono); font-size: 11px; padding: 4px 12px 4px 9px; border-radius: 999px; font-weight: 600; background: rgba(39, 67, 192, 0.1); color: var(--accent); display: inline-flex; align-items: center; gap: 6px; }
        [data-theme="dark"] .role-badge { background: rgba(74, 111, 232, 0.2); }
        .pin-panel { display: none; padding: 0 18px 16px; gap: 8px; }
        .pin-panel.active { display: flex; }
        .pin-input { flex: 1; padding: 10px 12px; border: 1px solid var(--input-border); border-radius: 6px; background: var(--input-bg); color: var(--text-primary); font-family: var(--font-mono); font-size: 16px; letter-spacing: 4px; }
        .pin-input:focus { outline: none; border-color: var(--accent); }
        .btn { padding: 10px 18px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { opacity: 0.9; }
        .empty-hint { text-align: center; color: var(--text-secondary); font-size: 13px; margin-top: 24px; }
        @media (max-width: 600px) {
            body { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">DECARD <span>PIPELINE</span></div>
        <div class="subtitle">Выберите себя из списка и введите PIN</div>
        <div class="people-list" id="peopleList"></div>
        <div class="empty-hint" id="emptyHint" style="display:none;">Список сотрудников пуст</div>
    </div>
    <div class="toast-container" id="toastContainer"></div>
    <script src="common.js"></script>
    <script>
        // Фикс: email раньше подставлялся прямо в onclick-атрибут — если бы в нём
        // оказалась кавычка, атрибут ломался бы. Теперь храним список людей
        // в переменной и берём email по id из неё.
        let lastLoadedPeople = [];

        async function loadPeople() {
            // Если уже есть активная сессия — сразу пускаем внутрь, не показывая экран входа
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) { window.location.href = 'index.html'; return; }

            const { data, error } = await supabaseClient.from('profiles').select('*').order('full_name', { ascending: true });
            if (error) { console.error(error); showToast('Не удалось загрузить список сотрудников', 'error'); return; }
            lastLoadedPeople = data || [];
            const list = document.getElementById('peopleList');
            if (!data || data.length === 0) { document.getElementById('emptyHint').style.display = 'block'; return; }
            list.innerHTML = data.map(p => `
                <div class="person-card">
                    <div class="person-row" onclick="togglePin('${p.id}')">
                        <span class="person-name">${escapeHtml(p.full_name)}</span>
                        <span class="role-badge"><span class="badge-dot"></span>${escapeHtml(roleLabels[p.role] || p.role)}</span>
                    </div>
                    <div class="pin-panel" id="pin-${p.id}">
                        <input type="password" class="pin-input" id="pin-input-${p.id}" placeholder="PIN" inputmode="numeric" onkeydown="if(event.key==='Enter') doLogin('${p.id}')">
                        <button class="btn btn-primary" onclick="doLogin('${p.id}')">Войти</button>
                    </div>
                </div>
            `).join('');
        }

        function togglePin(personId) {
            document.querySelectorAll('.pin-panel').forEach(panel => {
                if (panel.id !== `pin-${personId}`) panel.classList.remove('active');
            });
            const panel = document.getElementById(`pin-${personId}`);
            panel.classList.toggle('active');
            if (panel.classList.contains('active')) document.getElementById(`pin-input-${personId}`).focus();
        }

        async function doLogin(personId) {
            const pin = document.getElementById(`pin-input-${personId}`).value;
            if (!pin) { showToast('Введите PIN', 'error'); return; }
            const person = lastLoadedPeople.find(p => p.id === personId);
            if (!person) { showToast('Не удалось определить пользователя, обновите страницу', 'error'); return; }
            const { error } = await supabaseClient.auth.signInWithPassword({ email: person.login_email, password: pin });
            if (error) { console.error(error); showToast('Неверный PIN', 'error'); return; }
            window.location.href = 'index.html';
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadTheme();
            loadPeople();
        });
    </script>
</body>
</html>
