<video id="loginBg" class="login-bg" muted loop playsinline preload="auto" aria-hidden="true" tabindex="-1"><source src="media/login-bg.webm" type="video/webm"></video>
<div class="login-bg-veil" aria-hidden="true"></div>
<script>
(function () {
    var v = document.getElementById('loginBg');
    if (!v) return;
    var c = navigator.connection;
    var skip = (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) || (c && c.saveData) || !v.canPlayType('video/webm');
    if (skip) { v.remove(); return; }
    v.addEventListener('canplay', function () {
        var p = v.play();
        if (p && p.then) p.then(function () { v.classList.add('ready'); }).catch(function () { v.remove(); });
        else v.classList.add('ready');
    }, { once: true });
    v.addEventListener('error', function () { v.remove(); });
    v.load();
})();
</script>
