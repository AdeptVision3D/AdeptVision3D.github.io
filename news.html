<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decard Studio — Новости</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F1830">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { padding: 40px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { margin-bottom: 32px; border-bottom: 2px solid var(--border); padding-bottom: 24px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
        .header-left { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .page-title { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
        .btn-back { background: var(--card-bg); color: var(--text-primary); border: 1px solid var(--border); }

        .news-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; box-shadow: var(--card-shadow); padding: 20px 22px; margin-bottom: 16px; }
        .news-card.pinned { border-color: rgba(var(--accent-rgb), 0.4); box-shadow: 0 0 0 1px rgba(var(--accent-rgb), 0.15), var(--card-shadow); }
        .news-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
        .news-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .news-pin-badge { color: var(--accent); display: inline-flex; }
        .news-meta { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        .news-body { font-size: 14px; line-height: 1.6; white-space: pre-wrap; margin-top: 10px; }
        .news-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .news-icon-btn { border: none; background: none; color: var(--text-secondary); cursor: pointer; padding: 5px; border-radius: 5px; display: inline-flex; }
        .news-icon-btn:hover { color: var(--accent); background: rgba(var(--accent-rgb), 0.1); }
        .panel-empty { padding: 28px 20px; color: var(--text-secondary); font-size: 13px; text-align: center; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; }

        @media (max-width: 768px) {
            body { padding: 20px; }
            .header-top { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <div class="header-left">
                    <a href="index.html" class="btn btn-back">← Назад</a>
                    <span class="page-title">Новости</span>
                </div>
                <div style="display:flex; align-items:center; gap:12px;">
                    <button class="btn btn-primary" id="addNewsBtn" style="display:none;" onclick="openNewsFormModal()">+ Добавить новость</button>
                    <div class="user-box" id="userBox" style="display:flex; align-items:center; gap:10px; font-size:13px; color: var(--text-secondary);"></div>
                </div>
            </div>
        </header>

        <div id="newsList"></div>
    </div>

    <div class="modal" id="newsFormModal" style="display:none;">
        <div class="employee-modal-box" style="max-width: 520px;">
            <h3 id="newsFormTitle" style="font-size: 20px; font-weight: 700; margin-bottom: 20px;">Новая новость</h3>
            <div class="field">
                <label class="field-label">Заголовок *</label>
                <input type="text" id="newsFormTitleInput" placeholder="Например: Выплата зарплаты перенесена" class="field-input">
            </div>
            <div class="field">
                <label class="field-label">Текст *</label>
                <textarea id="newsFormBody" rows="6" placeholder="Текст новости" class="field-input field-textarea"></textarea>
            </div>
            <div class="field field-lg">
                <label style="display:flex; align-items:center; gap:8px; font-size: 13px; cursor:pointer;">
                    <input type="checkbox" id="newsFormPinned" style="width:16px; height:16px;">
                    Закрепить вверху ленты
                </label>
            </div>
            <div class="field-actions">
                <button class="btn btn-secondary" onclick="closeNewsFormModal()">Отмена</button>
                <button class="btn btn-primary" id="newsFormSubmitBtn" onclick="submitNewsForm()">Опубликовать</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <script src="common.js"></script>
    <script>
        let currentUser = null;
        let editingNewsId = null;
        let newsCache = [];

        async function requireAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return false; }
            const { data: profile, error } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
            if (error || !profile) { console.error(error); await supabaseClient.auth.signOut(); window.location.href = 'login.html'; return false; }
            currentUser = { id: profile.id, full_name: profile.full_name, role: profile.role, is_admin: !!profile.is_admin };
            renderUserBox();
            initAppSidebar(currentUser);
            document.getElementById('addNewsBtn').style.display = canManageNews(currentUser) ? '' : 'none';
            return true;
        }

        function renderUserBox() {
            const box = document.getElementById('userBox');
            if (!box || !currentUser) return;
            box.innerHTML = `<span>${currentUser.full_name} · ${roleLabels[currentUser.role] || currentUser.role}</span>
                <button class="btn btn-secondary" onclick="doLogout()" style="padding:4px 10px; font-size:12px;">Выйти</button>`;
        }

        async function loadNews() {
            const { data, error } = await supabaseClient
                .from('company_news')
                .select('*')
                .order('pinned', { ascending: false })
                .order('created_at', { ascending: false });
            if (error) {
                console.error(error);
                document.getElementById('newsList').innerHTML = '<div class="panel-empty">Не удалось загрузить новости</div>';
                return;
            }
            // Джойним автора вручную (не через nested select) — так принято во всём проекте
            const { data: profiles, error: profErr } = await supabaseClient.from('profiles').select('id, full_name');
            if (profErr) console.error(profErr);
            const nameById = {};
            (profiles || []).forEach(p => { nameById[p.id] = p.full_name; });
            newsCache = (data || []).map(n => ({ ...n, authorName: nameById[n.created_by] || 'Неизвестно' }));
            renderNews();
        }

        function renderNews() {
            const canManage = canManageNews(currentUser);
            const listEl = document.getElementById('newsList');
            if (newsCache.length === 0) {
                listEl.innerHTML = '<div class="panel-empty">Пока новостей нет' + (canManage ? ' — станьте первым, кто что-то объявит' : '') + '</div>';
                return;
            }
            listEl.innerHTML = newsCache.map(n => {
                const date = new Date(n.created_at).toLocaleString('ru-RU', { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                const authorName = n.authorName;
                const actions = canManage ? `
                    <div class="news-actions">
                        <button class="news-icon-btn" title="${n.pinned ? 'Открепить' : 'Закрепить'}" onclick="toggleNewsPin('${n.id}', ${!n.pinned})">${ICON.pin}</button>
                        <button class="news-icon-btn" title="Редактировать" onclick="openNewsFormModal('${n.id}')">${ICON.edit}</button>
                        <button class="news-icon-btn" title="Удалить" onclick="deleteNews('${n.id}')">${ICON.trash}</button>
                    </div>` : '';
                return `<div class="news-card ${n.pinned ? 'pinned' : ''}">
                    <div class="news-card-head">
                        <div>
                            <div class="news-title">${n.pinned ? `<span class="news-pin-badge">${ICON.pin}</span>` : ''}${escapeHtml(n.title)}</div>
                            <div class="news-meta">${escapeHtml(authorName)} · ${date}</div>
                        </div>
                        ${actions}
                    </div>
                    <div class="news-body">${escapeHtml(n.body)}</div>
                </div>`;
            }).join('');
        }

        function openNewsFormModal(id) {
            editingNewsId = id || null;
            const item = id ? newsCache.find(n => n.id === id) : null;
            document.getElementById('newsFormTitle').textContent = item ? 'Редактировать новость' : 'Новая новость';
            document.getElementById('newsFormSubmitBtn').textContent = item ? 'Сохранить' : 'Опубликовать';
            document.getElementById('newsFormTitleInput').value = item ? item.title : '';
            document.getElementById('newsFormBody').value = item ? item.body : '';
            document.getElementById('newsFormPinned').checked = item ? item.pinned : false;
            document.getElementById('newsFormModal').style.display = 'flex';
        }

        function closeNewsFormModal() {
            document.getElementById('newsFormModal').style.display = 'none';
            editingNewsId = null;
        }

        async function submitNewsForm() {
            const title = document.getElementById('newsFormTitleInput').value.trim();
            const body = document.getElementById('newsFormBody').value.trim();
            const pinned = document.getElementById('newsFormPinned').checked;
            if (!title || !body) { showToast('Заполните заголовок и текст', 'error'); return; }

            let error;
            if (editingNewsId) {
                ({ error } = await supabaseClient.from('company_news').update({ title, body, pinned, updated_at: new Date().toISOString() }).eq('id', editingNewsId));
            } else {
                ({ error } = await supabaseClient.from('company_news').insert({ title, body, pinned, created_by: currentUser.id }));
            }
            if (error) { console.error(error); showToast(isNetworkError(error) ? 'Нет соединения — попробуйте ещё раз' : 'Не удалось сохранить новость', 'error'); return; }
            showToast(editingNewsId ? 'Новость обновлена' : 'Новость опубликована', 'success');
            closeNewsFormModal();
            await loadNews();
        }

        async function toggleNewsPin(id, pinned) {
            const { error } = await supabaseClient.from('company_news').update({ pinned }).eq('id', id);
            if (error) { console.error(error); showToast('Не удалось обновить', 'error'); return; }
            await loadNews();
        }

        async function deleteNews(id) {
            if (!confirm('Удалить эту новость безвозвратно?')) return;
            const { error } = await supabaseClient.from('company_news').delete().eq('id', id);
            if (error) { console.error(error); showToast('Не удалось удалить', 'error'); return; }
            showToast('Новость удалена', 'success');
            await loadNews();
        }

        document.addEventListener('DOMContentLoaded', async function() {
            loadTheme();
            const ok = await requireAuth();
            if (!ok) return;
            initDeadlineReminders(currentUser);
            await loadNews();
        });
    </script>
</body>
</html>
