    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F1830">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <div class="header-left">
                    <a href="index.html" class="btn btn-back">← Назад</a>
                    <span class="page-title">Календарь</span>
                </div>
                <div class="user-box" id="userBox" style="display:flex; align-items:center; gap:10px; font-size:13px; color: var(--text-secondary);"></div>
            </div>
        </header>

        <div class="cal-toolbar">
            <div class="month-nav">
                <button class="month-nav-btn" onclick="shiftMonth(-1)">‹</button>
                <span class="month-nav-label" id="monthLabel"></span>
                <button class="month-nav-btn" onclick="shiftMonth(1)">›</button>
                <button class="btn btn-secondary" style="padding:6px 12px; font-size:12px;" onclick="goToday()">Сегодня</button>
            </div>
            <button class="btn btn-primary" id="addEventBtn" style="display:none;" onclick="openEventFormModal()">+ Добавить событие</button>
        </div>

        <div class="cal-grid">
            <div class="cal-weekdays">
                <div class="cal-weekday">Пн</div><div class="cal-weekday">Вт</div><div class="cal-weekday">Ср</div>
                <div class="cal-weekday">Чт</div><div class="cal-weekday">Пт</div><div class="cal-weekday">Сб</div><div class="cal-weekday">Вс</div>
            </div>
            <div class="cal-weeks" id="calWeeks"></div>
        </div>
    </div>

    <div class="modal" id="eventFormModal" style="display:none;">
        <div class="employee-modal-box" id="eventFormBox" style="max-width: 460px;"></div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="icons.js?v=20260930l"></script>
